
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planify - Simplify, Organize, Succeed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              planify: {
                bg: '#0B0E14',
                container: '#111827',
                card: '#161B22',
                panel: '#1F2933',
                hover: '#262C36',
                accent: {
                  dark: '#4C1D95',
                  DEFAULT: '#5B21B6',
                  hover: '#6D28D9',
                  light: '#7C3AED',
                  glow: '#A78BFA'
                },
                text: {
                  primary: '#F9FAFB',
                  secondary: '#CBD5E1',
                  muted: '#6B7280'
                },
                border: '#2A303C'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'accent-glow': '0 0 20px rgba(91, 33, 182, 0.25)',
              'card-hover': '0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 10px rgba(91, 33, 182, 0.1)',
            },
            animation: {
              'slide-left': 'slideLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 0.2s ease-out forwards',
            },
            keyframes: {
              slideLeft: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
<script type="importmap">
{

    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@heroicons/react/": "https://esm.sh/@heroicons/react@^2.2.0/"
  }
}
</script>
